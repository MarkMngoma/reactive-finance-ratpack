<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reactive Finance Ratpack API Documentation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <!-- Scalar API Reference -->
    <script
        id="api-reference"
        type="application/json"
        data-configuration='{"spec":{"url":"/openapi.yaml"}}'>
    </script>
    <script>
      var configuration = {
        spec: {
          url: '/openapi.yaml',
        },
      }

      document.getElementById('api-reference').dataset.configuration = JSON.stringify(configuration)
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
