paths:
  /v1/WriteModificationCurrencyResource:
    put:
      summary: Modify existing currency
      description: Modify an existing currency resource with updated JSON payload
      operationId: givenExistingCurrencyWhenModifyingThenVerifyNoContentResponse
      tags:
      - Write
      - Currency
      - Modification
      parameters:
      - name: cookie
        in: header
        required: false
        schema:
          type: string
        example: ""
      - name: Accept
        in: header
        required: false
        schema:
          type: string
        example: application/json
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
        example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currencyId:
                  type: integer
                  format: int32
                currencyCode:
                  type: string
                currencyName:
                  type: string
                currencySymbol:
                  type: string
                currencyFlag:
                  type: string
            example:
              currencyId: 840
              currencyCode: USD
              currencyName: United States Dollar (Modified)
              currencySymbol: $
              currencyFlag: 🇺🇸
        required: true
      responses:
        "500":
          description: Internal Server Error
          headers:
            content-length:
              schema:
                type: string
              example: "0"
  /v1/WriteCurrencyResource:
    post:
