                  type: string
                currencyFlag:
                  type: string
            example:
              currencyId: 978
              currencyCode: EUR
              currencyName: Euro
              currencySymbol: €
              currencyFlag: 🇪🇺
        required: true
      responses:
        "201":
          description: Created
          headers:
            Accept-Charset:
              schema:
                type: string
              example: UTF-8
            content-length:
              schema:
                type: string
              example: "17"
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            Access-Control-Allow-Methods:
              schema:
                type: string
              example: "GET, POST, DELETE, PUT, PATCH, TRACE"
            Access-Control-Allow-Headers:
              schema:
                type: string
              example: "Origin, Content-Type, Accept, Authorization, X-localization,\
                \ Proxy-Authorization"
            Content-Type:
              schema:
                type: string
              example: application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
  /v1/QueryCurrencyResource/{currencyCode}:
    get:
      summary: Query currency by code
      description: Query a single currency by its currency code
      operationId: givenCurrencyExistsWhenQueryingByCodeThenVerifyResult
      tags:
      - Query
      parameters:
      - name: currencyCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "404":
          description: Not Found
          headers:
            Accept-Charset:
              schema:
                type: string
              example: UTF-8
            content-length:
              schema:
                type: string
              example: "54"
            Access-Control-Allow-Origin:
              schema:
                type: string
              example: '*'
            Access-Control-Allow-Methods:
              schema:
                type: string
              example: "GET, POST, DELETE, PUT, PATCH, TRACE"
            Access-Control-Allow-Headers:
              schema:
                type: string
              example: "Origin, Content-Type, Accept, Authorization, X-localization,\
                \ Proxy-Authorization"
            Content-Type:
              schema:
                type: string
              example: application/json
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: integer
                    format: int32
                  message:
                    type: string
              example:
                error: 404
                message: No record found for currency
