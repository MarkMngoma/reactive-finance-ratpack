# =============================================================================
# Reactive Finance Ratpack — Full Application Stack
#
# Brings up the MariaDB database and the native application image together.
#
# Quick start:
#   1. Copy .env.example to .env and fill in secrets
#   2. docker compose up --build
# =============================================================================

services:

  # --------------------------------------------------------------------------
  # MariaDB — persistent relational database
  # --------------------------------------------------------------------------
  db:
    image: bitnami/mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-CHANGE_ME_ROOT}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-dboFinance}
      MARIADB_USER: ${MARIADB_USER:-dboFinance}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-CHANGE_ME}
    volumes:
      - reactive-finance-db-data:/bitnami/mariadb
    ports:
      - "${DB_EXPOSE_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost",
             "-u", "${MARIADB_USER:-dboFinance}",
             "--password=${MARIADB_PASSWORD:-CHANGE_ME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # App — native binary image
  # --------------------------------------------------------------------------
  app:
    image: ${APP_IMAGE:-reactive-finance-ratpack:latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Selects application-docker.yml as the active configuration profile.
      RATPACK_ENVIRONMENT: ${RATPACK_ENVIRONMENT:-docker}
      # Directory (relative to /app workdir) that holds the config YAML files.
      CONFIGURATION_PATH: /config/
      # Override JDBC connection details without rebuilding the image.
      # Ratpack maps JDBC__URL → jdbc.url, JDBC__USERNAME → jdbc.username, etc.
      JDBC__URL: ${JDBC__URL:-jdbc:mariadb://db:3306/dboFinance}
      JDBC__USERNAME: ${JDBC__USERNAME:-dboFinance}
      JDBC__PASSWORD: ${JDBC__PASSWORD:-CHANGE_ME}
    ports:
      - "${APP_PORT:-5051}:5051"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5051/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  reactive-finance-db-data:
